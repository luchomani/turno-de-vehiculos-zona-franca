name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *' 
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

permissions:
  contents: write # Permiso necesario para poder hacer el push

jobs:
  empty-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Create empty commit and push
        run: |
          git commit --allow-empty -m "chore: keep streamlit app alive [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push origin main
